name: 'OmniGraph Architecture Scan'
description: 'Detects distributed race conditions and architectural hazards in your PRs.'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  github_token:
    description: 'GitHub token for posting PR comments'
    required: true
    default: ${{ github.token }}
  fail_on_critical:
    description: 'Fail the action if critical findings are detected'
    required: false
    default: 'true'
  anthropic_api_key:
    description: 'Anthropic API key for AI Arbiter patches (Claude 3.5 Sonnet)'
    required: false
  google_api_key:
    description: 'Google API key for AI Arbiter patches (Gemini 1.5 Pro)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install OmniGraph Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ github.action_path }}/requirements.txt
        
    - name: Run OmniGraph Scan
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GOOGLE_API_KEY: ${{ inputs.google_api_key }}
        PYTHONUTF8: 1
      run: |
        # Only run PR comment on pull_request events
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          PR_NUMBER=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
          python ${{ github.action_path }}/main.py github-pr ${{ inputs.path }} \
            --repo ${{ github.repository }} \
            --pr $PR_NUMBER \
            --token ${{ inputs.github_token }}
        else
          # Fallback to standard CLI scan for pushes
          python ${{ github.action_path }}/main.py scan ${{ inputs.path }}
        fi
        
        EXIT_CODE=$?
        
        if [ "${{ inputs.fail_on_critical }}" = "true" ] && [ $EXIT_CODE -eq 1 ]; then
          echo "::error::OmniGraph detected CRITICAL race conditions. Blocking merge."
          exit 1
        fi
        
        # Always exit 0 if fail_on_critical is false, unless it's a hard crash (exit 2)
        if [ $EXIT_CODE -eq 2 ]; then
          exit 2
        fi
        
        exit 0
